
name: Extract ShopVerse ZIP

on:
  push:
    paths:
      - 'shopverse-r2-complete.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/shopverse-package
          unzip -q -o shopverse-r2-complete.zip -d /tmp/shopverse-package

          rsync -a --delete \
            --exclude='.github/' \
            --exclude='.git/' \
            /tmp/shopverse-package/shopverse/ ./

          rm -f shopverse-r2-complete.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract ShopVerse project ZIP"
            git push
          fi
          
